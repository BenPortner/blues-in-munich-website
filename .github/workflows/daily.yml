name: Scrape & deploy

on:
  schedule:
    - cron: "0 4 * * *"   # daily, ~05:00/06:00 Munich time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit data/events.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Scrape sources
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m scraper

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -- data/events.json
          git pull --ff-only origin main
          git stash pop
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Build site
        run: python -m web.build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
