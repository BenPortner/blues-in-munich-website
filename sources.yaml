# Scrape targets for Blues in Munich.
#
# To add a source, append an entry. Fields:
#   id            unique slug (used in event ids and logs)
#   name          display name (shown on the site; for schools also the school link text)
#   kind          school | venue | band | aggregator | manual
#                 events from a `school` get a link to the school (url below)
#   url           homepage — the school/venue link on the site
#   adapter       how to read it: one of the modules in scraper/adapters/
#                 generic: jsonld (schema.org JSON-LD pages), ical (.ics feed, e.g. Events Manager),
#                          mfgigcal (WordPress gig calendar plugin), manual
#                 site-specific: vintage_club, boogie_baeren, unterfahrt,
#                          glockenbachwerkstatt, misterbs, swinginmunich, ticketmaster,
#                          inmuenchen,
#                          oksanapavlova, rheinpfalz_schwabing, gansamwasser,
#                          village, hepcat, tollwood, stragula, arsmusica,
#                          truderinger_kulturkreis, mvp,
#                          muenchen_online (a venue's page on muenchen-online.de)
#                 generic WordPress: tribe_events (The Events Calendar REST API)
#   enabled       false to keep an entry without scraping it
#   default_type  class | workshop | social | concert | other (when not inferable;
#                 other = exhibitions, instrument/singing courses)
#   filter        blues        keep events mentioning blues (title/description/tags)
#                 blues_title  only title/tags count (venues that mention blues in passing)
#                 none         keep everything (all-blues sources)
#   exclude       optional list of regexes; matching events are dropped
#   params        adapter-specific options (see the adapter's docstring)

# Past events stay listed (under "Past events") if they ended on or after `since`;
# optional `types: [class, workshop]` limits that to some event types. Sites take past
# events off their pages, so the runner carries them over from the last run.
archive:
  since: 2026-01-01

sources:
  # --- Dance schools -------------------------------------------------------
  - id: vintage-club
    name: Vintage Club
    kind: school
    url: https://www.vintage-club.de/
    adapter: vintage_club
    enabled: true
    default_type: class
    filter: blues

  - id: boogie-baeren
    name: Boogie-Bären München
    kind: school
    url: https://www.boogie-baeren.de/
    adapter: boogie_baeren
    enabled: true
    default_type: social
    filter: blues
    params:
      max_pages: 6         # /kalender listing pages
      training_url: https://www.boogie-baeren.de/training   # weekly class timetable (blues classes)

  - id: oksana-pavlova
    name: Oksana Pavlova
    kind: school
    url: https://oksanapavlova.de/
    adapter: oksanapavlova   # workshops are announced as news posts (calendar empty, Kursplan is an image)
    enabled: true
    default_type: workshop
    filter: blues          # mostly Lindy Hop; monthly-ish blues workshops at Arnulfstr. 195

  - id: hepcat-club
    name: Hep Cat Club
    kind: school
    url: https://hepcatclub.com/
    adapter: hepcat
    enabled: true
    default_type: class
    filter: blues_title    # swing school in Augsburg; the weekly swing social lists blues among its styles

  # --- Venues & bands (concerts, sessions) ----------------------------------
  - id: glockenbachwerkstatt
    name: Glockenbachwerkstatt – Fish'n Blues
    kind: venue
    url: https://www.glockenbachwerkstatt.de/
    adapter: glockenbachwerkstatt
    enabled: true
    default_type: concert
    filter: none           # the category below is the weekly blues series
    params:
      categories: [fishnblues]

  - id: rheinpfalz-schwabing
    name: Rheinpfalz Schwabing
    kind: venue
    url: https://rheinpfalz-schwabing.de/veranstaltungen/
    adapter: rheinpfalz_schwabing
    enabled: true
    default_type: concert
    filter: blues          # pub with oldies/rock/jazz nights too; keep gigs whose blurb says blues

  - id: bernd-bauer-blues-band
    name: Bernd Bauer Blues Band
    kind: band
    url: https://berndbauerbluesband.de/
    adapter: mfgigcal
    enabled: true
    default_type: concert
    filter: none           # a blues band (hosts the "Stormy Wednesday" open blues session)
    params:
      listing_url: https://berndbauerbluesband.de/termine/
      only_city: "München|Munich|\\b8[01]\\d{3}\\b"

  - id: unterfahrt
    name: Jazzclub Unterfahrt
    kind: venue
    url: https://www.unterfahrt.de/
    adapter: unterfahrt
    enabled: true
    default_type: concert
    filter: blues_title    # jazz club: only gigs billed as blues (title or "Blues" series)
    params:
      months: 4

  - id: jazzbar-vogler
    name: Jazzbar Vogler
    kind: venue
    url: https://www.jazzbar-vogler.com/
    adapter: muenchen_online
    enabled: true
    default_type: concert
    filter: blues_title    # jazz/Latin/soul bar; its own site has no programme (newsletter, FB, Instagram only)
    params:
      page_url: https://www.muenchen-online.de/veranstaltungsorte/jazzbar-vogler-2361/

  - id: misterbs
    name: Mister B's
    kind: venue
    url: https://mister-bs.bar/
    adapter: misterbs
    enabled: true
    default_type: concert
    filter: blues_title    # small jazz/live bar: artist bios mention blues in passing

  - id: gans-am-wasser
    name: Café Gans am Wasser
    kind: venue
    url: https://www.gansamwasser.de/
    adapter: gansamwasser
    enabled: true
    default_type: concert
    filter: blues          # beer garden in Westpark: free live music (pop/folk/rock), plus kids' and culture events

  - id: village-habach
    name: Village Habach
    kind: venue
    url: https://www.village-habach.de/
    adapter: village
    enabled: true
    default_type: concert
    filter: blues          # blues club near Murnau (~60 km out); also rock, funk, reggae nights and a monthly open session

  - id: tollwood
    name: Tollwood
    kind: venue
    url: https://www.tollwood.de/
    adapter: tollwood      # season calendar from the home page; its calendar is empty between festivals
    enabled: true
    default_type: concert
    filter: blues_title    # festival: free Hexenkessel bands of every genre; the billed genre is a tag

  - id: stragula
    name: Stragula
    kind: venue
    url: https://stragula.de/
    adapter: stragula
    enabled: true
    default_type: concert
    filter: blues_title    # Westend restaurant stage, Saturday gigs of every genre; band blurbs mention blues in passing

  - id: ackermannbogen
    name: Ackermannbogen e.V.
    kind: venue
    url: https://ackermannbogen-ev.de/programm-alles
    adapter: tribe_events
    enabled: true
    default_type: concert
    filter: blues_title    # neighbourhood association; monthly "Be My Guest" jazz concerts (KreativGarage), some tagged BluesJazz
    params:
      categories: [musik, musik-gesang]   # the rest is ~800 kids' dance, fitness and craft dates

  - id: pasinger-fabrik
    name: Pasinger Fabrik
    kind: venue
    url: https://www.pasinger-fabrik.de/
    adapter: tribe_events
    enabled: true
    default_type: concert
    filter: blues          # Pasing culture centre; blues/roots acts (Rusty Stone, Ludwig Seuss, Rad Gumbo) say so only in the blurb
    params:
      categories: [musik]  # ~35 upcoming; the rest is theatre, cabaret, opera, film, courses
      venue_prefix: Pasinger Fabrik   # the API names only the room ("Wagenhalle", "Kleine Bühne")
      address: August-Exter-Str. 1, 81245 München   # missing on some rooms

  - id: ars-musica
    name: ars musica e.V.
    kind: venue
    url: https://www.ars-musica-muenchen.de/
    adapter: arsmusica
    enabled: true
    default_type: concert
    filter: blues          # Sendling music association; small folk/songwriter concerts, genre line kept as a tag

  - id: ubo9
    name: UBO 9
    kind: venue
    url: https://www.ubo9.de/
    adapter: tribe_events
    enabled: true
    default_type: concert
    filter: blues_title    # Aubing culture centre; open stages, jazz, tango jams; blurbs mention blues in passing
    params:
      venue: UBO 9         # events rarely name a venue
      address: Ubostraße 9, 81245 München

  - id: kunst-in-sendling
    name: Kunst in Sendling e.V.
    kind: venue
    url: https://www.kunst-in-sendling.com/
    adapter: tribe_events
    enabled: true
    default_type: concert
    filter: blues          # artists' association: exhibitions at the Sendlinger Kulturschmiede with concerts alongside

  - id: buergersaal-fuerstenried
    name: Bürgersaal Fürstenried
    kind: venue
    url: https://www.buergersaal-fuerstenried.de/
    adapter: tribe_events
    enabled: true
    default_type: concert
    filter: blues          # neighbourhood hall: dance-band afternoons, sing-alongs, amateur theatre
    params:
      venue: Bürgersaal Fürstenried   # events rarely name a venue, and theirs is misspelled
      address: Züricher Str. 35, 81476 München

  - id: einewelthaus
    name: EineWeltHaus
    kind: venue
    url: https://www.einewelthaus.de/
    adapter: ical
    enabled: true
    default_type: concert
    filter: blues          # intercultural centre (talks, films, world music); now and then a jazz/blues workshop
    params:
      ics_url: https://www.einewelthaus.de/events.ics   # WordPress Events Manager feed, upcoming events

  - id: truderinger-kulturkreis
    name: Truderinger Kulturkreis e.V.
    kind: venue
    url: https://www.truderingerkulturkreis.de/
    adapter: truderinger_kulturkreis
    enabled: true
    default_type: concert
    filter: blues          # a few concerts a year; the January HaberJazzBand concert is billed as blues, Dixieland and swing

  # --- Aggregators ---------------------------------------------------------
  - id: swinginmunich
    name: SwinginMunich.de
    kind: aggregator
    url: https://www.swinginmunich.de/en
    adapter: swinginmunich
    enabled: true
    default_type: social
    filter: blues          # swing calendar: keep only events mentioning blues
    params:
      max_pages: 6         # listing pages (~15 dates each); stops at the first empty page

  - id: inmuenchen
    name: IN München
    kind: aggregator
    url: https://www.in-muenchen.de/
    adapter: inmuenchen
    enabled: true
    default_type: concert
    filter: blues_title    # API search matches any mention; keep blues in title or genre
    params:
      max_pages: 3         # 100 listings each; ~170 match "blues"

  - id: mvp
    name: mvp.de (Jazz & Blues)
    kind: aggregator
    url: https://www.mvp.de/
    adapter: mvp
    enabled: true
    default_type: concert
    filter: blues_title    # ticket listing of jazz and blues concerts; mostly the same gigs as IN München, plus a few it misses

  - id: ticketmaster
    name: Ticketmaster (genre Blues)
    kind: aggregator
    url: https://www.ticketmaster.de/
    adapter: ticketmaster
    enabled: true          # skipped automatically unless TICKETMASTER_API_KEY is set
    default_type: concert
    filter: none
    params:
      classification: Blues
      latlon: [48.1372, 11.5755]
      radius_km: 30

  # --- Hand-curated --------------------------------------------------------
  - id: manual
    name: Curated
    kind: manual
    url: https://github.com/
    adapter: manual
    enabled: true
    default_type: concert
    filter: none
    params:
      file: manual_events.yaml

# Candidates checked but not scraped yet (no machine-readable listing, blocked,
# or no longer the venue's site). Move one up once an adapter exists.
#
#  - Kongressbar (swing/jazz/blues live bands Fri/Sat) — https://kongressbar.de/events-live-bands-djs/
#      events are rendered by a plugin without a plain list; needs a custom adapter.
#  - Kulturzentrum Giesinger Bahnhof — http://www.giesinger-bahnhof.de (hosts Stormy Wednesday)
#      skipped on purpose: the program (/programm/) is scrapable, but it is mostly children's theatre,
#      dance classes and readings; Stormy Wednesday is the only reliably blues event and the
#      Bernd Bauer Blues Band calendar above already lists it.
#  - Eventim / rausgegangen / regioactive Jazz & Blues listings — block scrapers (403/timeouts)
#  - Bandsintown — https://www.bandsintown.com — API only looks up one artist at a time (no city or
#      genre search), keys are only issued to artists or their teams, and the site's city pages
#      are rendered by JavaScript. Usable only per band, with that band's own API key.
#  - Backstage München (Club/Halle/Werk) — https://www.backstage.eu/events
#      found 2026-10-17. Events are loaded by JavaScript ("Loading..." in the HTML); needs the
#      underlying API or a headless browser. IN München already lists its bigger blues gigs.
#  - Bang Bang! Concerts (Bluesfest am Rotkreuzplatz, annual August open-air) — https://bangbangconcerts.de
#      found 2026-10-17. One event a year (16.08.2026 was the 2026 edition); /events/ returns 404,
#      the event pages are individual. Not worth an adapter; add to manual_events.yaml each year.
#  - Inninger Bluestage / Wolfratshauser Blues Festival (autumn festivals, Ammersee/Isartal) —
#      found 2026-10-17. Organizers' own sites not identified; already covered through IN München.
#  - Interim / Bürgertreff Laim (hosts the Jazzclub München jam and occasional blues bands, e.g. Blue52) —
#      https://interim-kultur.de/Programm/
#      found 2026-10-23. Programme is loaded by JavaScript (empty in the HTML); mostly jazz/theatre, no upcoming
#      blues dates seen. Its listings appear on IN München, which catches blues-titled ones.
#  Neighbourhood culture associations (Stadtteilkultur), checked 2026-10-28 from the city's lists
#  (stadt.muenchen.de/infos/kulturvereine-initiativen.html and the Stadtteilkulturzentren listing):
#  (UBO 9, Kunst in Sendling, Bürgersaal Fürstenried, EineWeltHaus and Truderinger Kulturkreis are scraped above.)
#  - Others with music programmes but no blues seen on their homepage: Kulturhaus Milbertshofen,
#      Kulturzentrum Trudering, Kultur-Forum2, Kulturforum München-West, Pelkovenschlössl, LUISE Kulturzentrum
#      (ars musica's venue, covered above), Kulturkeller, Seidlvilla, Die Linie 1, Mohr-Villa.
