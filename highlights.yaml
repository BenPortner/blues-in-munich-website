# What counts as a highlight on the site: a ★ badge and the "Highlights" filter chip.
# Events at a `never` venue are skipped by rules 2-4.
#
# 1. `events`: events picked by hand, by title.
# 2. `always`: events of these types from these sources (ids from sources.yaml).
# 3. Concerts with a well-known artist: see `artists` below.
# 4. Concerts and festivals in a venue that holds at least `min_capacity` people.
#    Venues not listed below never count; `python -m web.build` prints the concert
#    venues it couldn't find, so you can add them.
#
# Venue matching ignores case, accents and punctuation, and looks for `name` (or any
# `match` alias) as whole words inside the event's venue. The longest match wins, so
# "Schlachthof – Ox" picks the Ox entry over plain "Schlachthof".
#
# Capacities are approximate. They only need to land on the right side of the cutoff.

# Events picked by hand. An event matches when its title contains the text as whole words
# (case, accents and punctuation ignored): "Stormy Wednesday" matches "Bernd Bauer Blues
# Band: Stormy Wednesday". Add a date to pick only that day of a recurring event.
# Works for any event: scraped ones and those in manual_events.yaml.
#
# events:
#   - Eric Bibb
#   - title: Stormy Wednesday
#     date: 2026-11-18
events: []

# Venues whose events are never highlights (matched like `venues` below), whatever the
# rules after this say. Events picked by hand in `events` still are.
never:
  - Village Habach                     # far out of town (near Murnau)

always:
  - source: boogie-baeren
    types: [workshop]

# Well-known artists, from Last.fm listener counts. The daily scrape finds artist names in
# concert titles and looks them up (needs LASTFM_API_KEY; without it this rule is off).
# For scale: Eric Bibb ~126k, Ana Popovic ~79k, Henrik Freischlader ~56k,
# Danny Bryant ~15k, Sari Schorr ~5k, Kai Strauss ~3k listeners (October 2026).
artists:
  min_listeners: 50000
  # Names Last.fm matches to the wrong artist (e.g. a common name shared with someone famous)
  ignore: []
  # Acts billed differently from their Last.fm name: "name in the title": "Last.fm name"
  aliases:
    Devon Allman Blues Summit: Devon Allman
  # Links for the event cards, replacing the Last.fm profile: "name": url. Also links acts that
  # Last.fm doesn't know (they never count as well-known).
  links: {}

min_capacity: 400

venues:
  # --- big halls and arenas -------------------------------------------------
  - name: Tollwood Sommerfestival      # listings name the festival, concerts are in the Musik-Arena tent
    match: [Musik-Arena]
    capacity: 5000
  - name: Circus Krone
    capacity: 3000
  - name: Backstage Werk
    capacity: 1500
  - name: Muffathalle
    capacity: 1400
  - name: Prinzregententheater
    capacity: 1000
  - name: Backstage Halle
    capacity: 600
  - name: Stadtsaal Fürstenfeld
    match: [Fürstenfeld Stadtsaal]
    capacity: 650
  - name: Strom
    capacity: 500
  - name: Schlachthof                  # main hall; sources say 350–600 depending on seating
    match: [Schlachthof Saal]
    capacity: 500
  - name: Ampere                       # Muffatwerk's small hall
    capacity: 400

  # --- clubs, bars and small stages ---------------------------------------
  - name: Backstage Club
    capacity: 350
  - name: Veranstaltungsforum Fürstenfeld   # without a hall: assume the Kleiner Saal
    capacity: 270
  - name: Jazzclub Unterfahrt
    match: [Unterfahrt]
    capacity: 250
  - name: Import Export
    capacity: 250
  - name: Milla
    capacity: 250
  - name: Bayerischer Hof Night Club
    capacity: 200
  - name: Drehleier
    capacity: 150
  - name: Kulturzentrum Giesinger Bahnhof
    match: [Giesinger Bahnhof]
    capacity: 150
  - name: Iberl Bühne
    capacity: 150
  - name: Glockenbachwerkstatt
    capacity: 100
  - name: Vereinsheim
    capacity: 100
  - name: Theater Leo17
    capacity: 100
  - name: Wirtshaus Tannengarten
    capacity: 100
  - name: Fraunhofer Theater
    capacity: 100
  - name: Galli Theater
    capacity: 80
  - name: Hofspielhaus
    capacity: 80
  - name: Pasinger Fabrik Kleine Bühne
    capacity: 80
  - name: Rheinpfalz Schwabing
    capacity: 60
  - name: Barschwein
    capacity: 50
  - name: Schlachthof Ox
    capacity: 50
  - name: ars musica
    capacity: 50
