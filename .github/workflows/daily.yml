name: Scrape & deploy

# The daily run scrapes, commits the new events and deploys. A push to main only tests,
# rebuilds from the committed data/events.json and deploys. Manual runs scrape unless the
# "Scrape sources" box is unticked.
on:
  schedule:
    - cron: "0 4 * * *"   # daily, ~05:00/06:00 Munich time
  workflow_dispatch:
    inputs:
      scrape:
        description: Scrape sources (untick to only rebuild and deploy)
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write   # commit data/raw + data/events.json, push gh-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCRAPE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scrape) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      # Last.fm lookups are cached between runs but never committed (API terms).
      # A new key per run saves the updated cache; restore-keys picks up the latest one.
      - name: Restore artist cache
        if: env.SCRAPE == 'true'
        uses: actions/cache@v4
        with:
          path: data/artists.json
          key: lastfm-artists-${{ github.run_id }}
          restore-keys: lastfm-artists-

      - name: Scrape sources
        if: env.SCRAPE == 'true'
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python -m scraper

      - name: Commit updated events
        if: env.SCRAPE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -- data/events.json data/raw
          git pull --ff-only origin main
          git stash pop
          git add data/events.json data/raw
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Build site
        run: python -m web.build

      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          echo "www.bluesinmunich.de" > CNAME   # keeps the custom domain across force-pushes
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site $(date -u +%F)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages:gh-pages
